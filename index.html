<!DOCTYPE html>
<html>
	<head>
		<link rel="icon"href="icon.svg">
		<title>Relation Index</title>

		<link rel="stylesheet"type="text/css"href="styles.css">
	</head>
	<body>
		<div id="toolbar">
			<!-- left align -->
			<div>
				<div id="back" onclick="goBack()"><div class="pill"><span class="icon"></span><span class="label">back</span></div></div>
				<div id="recent"></div>
			</div>
			<!-- center align -->
			<div>
				<div id="add" onclick="addPerson()"><div class="pill"><span class="label">add</span><span class="icon"></span></div></div>
				<div id="searchBox">
					<input id="search" type="text" placeholder="Search..." autocomplete="off" oninput="updateSearch()" onfocus="updateSearch()" onkeydown="handleSearchKey(event)">
					<div id="results" onmousedown="event.preventDefault()"></div>
				</div>
			</div>
			<!-- right align -->
			<div>
				<div id="import" onclick="chooseImportFile()"><div class="pill"><span class="label">Import</span><span class="icon"></span></div></div>
				<div id="export" onclick="exportData()"><div class="pill"><span class="label">Export</span><span class="icon"></span></div></div>
				<div id="exportSize"></div>
				<div id="exportNote"></div>
				<input id="importInput" type="file" accept=".zip" hidden onchange="readImportFile(event)">
			</div>
		</div>
		<div id="profile">
			<div id="header">
				<div id="photo" onclick="openPhoto()"></div>
				<input id="photoInput" type="file" accept="image/*" hidden onchange="choosePhotoFile(event)">
				<div id="details">
					<div id="name"></div>
					<div id="lifespan"></div>
				</div>
			</div>
			<div id="gallery" ondragover="event.preventDefault()" ondrop="dropGalleryFiles(event)"></div>
			<input id="galleryInput" type="file" accept="image/*" multiple hidden onchange="uploadGalleryImages(event)">
		</div>
		<dialog id="nameDialog">
			<form onsubmit="saveName(event)" oninput="updateNameDialog()">
				<div class="title" id="nameTitle"></div>
				<div class="nameInputs">
					<label class="first"><span class="name">First name</span><input id="nameFirst" type="text" autocomplete="off"></label>
					<label class="last"><span class="name">Last name</span><input id="nameLast" type="text" autocomplete="off"></label>
				</div>
				<div class="heading">Source order</div>
				<input id="nameOrder" type="hidden">
				<div class="choices" id="nameOrderChoices"></div>
				<div class="description" id="nameOrderDescription"></div>
				<input id="nameLink" type="text" placeholder="Link (optional)" autocomplete="off" autocapitalize="off" spellcheck="false">
				<input id="nameNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<div class="issue" id="nameIssue"></div>
				<div class="list" id="nameList"></div>
				<div class="buttons">
					<button type="button" onclick="closeName()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="dateDialog">
			<form onsubmit="saveDate(event)" oninput="updateDateDialog()">
				<div class="tabs">
					<button type="button" id="birthTab" onclick="switchDateKind(`birth`)">Birth</button>
					<button type="button" id="deathTab" onclick="switchDateKind(`death`)">Death</button>
				</div>
				<div class="dateInputs">
					<label class="day"><span class="name">Day</span><input id="dateDay" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="month"><span class="name">Month</span><input id="dateMonth" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="year"><span class="name">Year</span><input id="dateYear" type="text" inputmode="numeric" maxlength="4" autocomplete="off"></label>
				</div>
				<div class="heading">Source order</div>
				<input id="dateOrder" type="hidden">
				<div class="choices" id="dateOrderChoices"></div>
				<div class="description" id="dateOrderDescription"></div>
				<input id="dateLink" type="text" placeholder="Link (optional)" autocomplete="off" autocapitalize="off" spellcheck="false">
				<input id="dateNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<label class="checkbox" id="deceasedLabel"><input id="dateDeceased" type="checkbox">Deceased, date unknown</label>
				<div class="issue" id="dateIssue"></div>
				<div class="list" id="dateList"></div>
				<div class="buttons">
					<button type="button" onclick="closeDate()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="imageDialog" onclose="releaseImage()" onkeydown="handleImageKey(event)">
			<form onsubmit="saveImage(event)" oninput="updateImageDialog()">
				<div class="picture">
					<div class="frame" id="imagePicture"></div>
					<button type="button" class="previous" id="imagePrevious" onclick="showAdjacentImage(-1)" hidden>&#8249;</button>
					<button type="button" class="next" id="imageNext" onclick="showAdjacentImage(1)" hidden>&#8250;</button>
					<div class="counter" id="imageCounter"></div>
				</div>
				<div class="heading">People in the image</div>
				<div class="list people" id="imagePeople"></div>
				<input id="imagePersonName" type="text" placeholder="Add a person (optional)" autocomplete="off" onkeydown="handleImagePersonKey(event)">
				<div class="list" id="imageSuggestions"></div>
				<div class="notice" id="imageNotice"></div>
				<div class="heading">Date</div>
				<div class="dateInputs">
					<label class="day"><span class="name">Day</span><input id="imageDay" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="month"><span class="name">Month</span><input id="imageMonth" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="year"><span class="name">Year</span><input id="imageYear" type="text" inputmode="numeric" maxlength="4" autocomplete="off"></label>
				</div>
				<div class="heading">Note</div>
				<textarea id="imageNote" rows="3"></textarea>
				<div class="issue" id="imageIssue"></div>
				<div class="buttons">
					<button type="button" class="profile" id="imageProfile" onclick="setImageAsProfile()">Use as profile photo</button>
					<button type="button" class="delete" id="imageDelete" onclick="deleteImage()">Delete image</button>
					<button type="button" onclick="closeImage()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="photoDialog" onclose="releasePhoto()">
			<form onsubmit="saveProfile(event)">
				<div class="title">Profile picture</div>
				<div class="cropper" id="photoCropper" onpointerdown="startPhotoDrag(event)" onpointermove="movePhotoDrag(event)" onpointerup="endPhotoDrag()" onpointercancel="endPhotoDrag()"><img id="photoCropImage" alt="" hidden><div class="frame" id="photoCropFrame" hidden></div></div>
				<div class="heading">Size</div>
				<input id="photoSize" type="range" min="0.1" max="1" step="0.01" value="1" oninput="updatePhotoSize()" disabled>
				<div class="issue" id="photoIssue"></div>
				<div class="buttons">
					<button type="button" class="choose" onclick="choosePhoto()">Choose image</button>
					<button type="button" onclick="closePhoto()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="orphanDialog" onclose="releaseOrphanFolder()">
			<form onsubmit="event.preventDefault()">
				<div class="title">Orphaned images</div>
				<div class="notice" id="orphanCount"></div>
				<div id="orphanTiles"></div>
				<div class="buttons">
					<button type="button" onclick="closeOrphanFolder()">Close</button>
				</div>
			</form>
		</dialog>
		<dialog id="importDialog" onclose="releaseImport()" oncancel="handleImportCancel(event)">
			<form onsubmit="event.preventDefault()">
				<div class="title" id="importTitle"></div>
				<div class="notice" id="importMessage"></div>
				<div class="summary" id="importSummary"></div>
				<div class="compare" id="importCompare"></div>
				<label class="checkbox" id="importApplyAllLabel" hidden><input id="importApplyAll" type="checkbox">Apply to all remaining conflicts</label>
				<div class="issue" id="importIssue"></div>
				<div class="buttons">
					<button type="button" id="importCancel" onclick="closeImportDialog()">Cancel</button>
					<button type="button" id="importKeepCurrent" onclick="chooseImportResolution(`keep`)" hidden>Keep current</button>
					<button type="button" id="importKeepBoth" onclick="chooseImportResolution(`duplicate`)" hidden>Keep both</button>
					<button type="button" id="importReplacePerson" onclick="chooseImportResolution(`replace`)" hidden>Replace</button>
					<button type="button" id="importMerge" onclick="chooseImportMode(`merge`)" hidden>Merge</button>
					<button type="button" class="replace" id="importReplace" onclick="chooseImportMode(`replace`)" hidden>Replace</button>
					<button type="button" id="importClose" onclick="closeImportDialog()" hidden>Close</button>
				</div>
			</form>
		</dialog>
	</body>
	<script type="text/javascript"src="scripts.js"></script>
</html>
