<!DOCTYPE html>
<html>
	<head>
		<link rel="icon"href="icon.svg">
		<title>Relation Index</title>

		<link rel="stylesheet"type="text/css"href="styles.css">
	</head>
	<body>
		<div id="toolbar">
			<!-- left align -->
			<div>
				<div id="back" onclick="goBack()"><div class="pill"><span class="icon"></span><span class="label">back</span></div></div>
				<div id="recent"></div>
			</div>
			<!-- center align -->
			<div>
				<div id="add" onclick="addPerson()"><div class="pill"><span class="label">add</span><span class="icon"></span></div></div>
				<input id="search" type="text" placeholder="Search...">
			</div>
			<!-- right align -->
			<div></div>
		</div>
		<div id="profile">
			<div id="name"></div>
		</div>
		<dialog id="renameDialog">
			<form onsubmit="saveName(event)">
				<input id="renameFirstName" type="text" placeholder="First name" autocomplete="off">
				<input id="renameLastName" type="text" placeholder="Last name" autocomplete="off">
				<div class="buttons">
					<button type="button" onclick="closeRename()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
	</body>
	<script type="text/javascript"src="scripts.js"></script>
</html>
