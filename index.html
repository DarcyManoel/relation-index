<!DOCTYPE html>
<html>
	<head>
		<link rel="icon"href="icon.svg">
		<title>Relation Index</title>

		<link rel="stylesheet"type="text/css"href="styles.css">
	</head>
	<body>
		<div id="toolbar">
			<!-- left align -->
			<div>
				<div id="back" onclick="goBack()"><div class="pill"><span class="icon"></span><span class="label">back</span></div></div>
				<div id="recent"></div>
				<div id="directoryButton" onclick="openDirectory()"><div class="pill"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h11M9 12h11M9 17h11"/><path d="M4 7h.01M4 12h.01M4 17h.01"/></svg></span><span class="label">Directory</span></div></div>
			</div>
			<!-- center align -->
			<div>
				<div id="add" onclick="addPerson()"><div class="pill"><span class="label">add</span><span class="icon"></span></div></div>
				<div id="searchBox">
					<input id="search" type="text" placeholder="Search..." autocomplete="off" oninput="updateSearch()" onfocus="updateSearch()" onkeydown="handleSearchKey(event)">
					<div id="results" onmousedown="event.preventDefault()"></div>
				</div>
			</div>
			<!-- right align -->
			<div>
				<div id="import" onclick="openImportDialog()"><div class="pill"><span class="label">Import</span><span class="icon"></span></div></div>
				<div id="export" onclick="exportData()"><div class="pill"><span class="label">Export</span><span class="icon"></span></div></div>
				<div id="exportNote"></div>
				<input id="importInput" type="file" accept=".json,application/json" hidden onchange="readImportFile(event)">
			</div>
		</div>
		<div id="profile">
			<div id="header">
				<div class="silhouette"></div>
				<div id="details">
					<div id="name"></div>
					<div id="gender" onclick="editGender()"></div>
					<div id="lifespan"></div>
				</div>
			</div>
			<div id="profileBody">
				<div id="relations"></div>
				<div id="timeline"></div>
			</div>
		</div>
		<div id="directory" hidden></div>
		<dialog id="nameDialog">
			<form onsubmit="saveName(event)" oninput="updateNameDialog()" novalidate>
				<div class="title" id="nameTitle"></div>
				<div class="nameInputs">
					<label class="first"><span class="name">First name</span><input id="nameFirst" type="text" autocomplete="off"></label>
					<label class="last"><span class="name">Last name</span><input id="nameLast" type="text" autocomplete="off"></label>
				</div>
				<input id="nameNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<div class="linkInputs" id="nameLinks"></div>
				<div class="issue" id="nameIssue"></div>
				<div class="list" id="nameList"></div>
				<div class="buttons">
					<button type="button" onclick="closeName()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="newPersonDialog">
			<form onsubmit="saveNewPerson(event)" oninput="updateNewPersonDialog()">
				<div class="title">New person</div>
				<div class="newPersonFields" id="newPersonFields"></div>
				<div class="buttons">
					<button type="button" onclick="closeNewPerson()">Cancel</button>
					<button type="submit">Create</button>
				</div>
				<div class="issue" id="newPersonIssue"></div>
			</form>
		</dialog>
		<dialog id="genderDialog">
			<form onsubmit="saveGender(event)" oninput="updateGenderDialog()" novalidate>
				<div class="title">Gender</div>
				<input id="genderValue" type="hidden">
				<div class="choices" id="genderValueChoices"></div>
				<input id="genderNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<div class="linkInputs" id="genderLinks"></div>
				<div class="list" id="genderList"></div>
				<div class="buttons">
					<button type="button" onclick="closeGender()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="dateDialog">
			<form onsubmit="saveDate(event)" oninput="updateDateDialog()" novalidate>
				<div class="tabs">
					<button type="button" id="birthTab" onclick="switchDateKind(`birth`)">Birth</button>
					<button type="button" id="deathTab" onclick="switchDateKind(`death`)">Death</button>
				</div>
				<div class="dateInputs">
					<label class="day"><span class="name">Day</span><input id="dateDay" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="month"><span class="name">Month</span><input id="dateMonth" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label>
					<label class="year"><span class="name">Year</span><input id="dateYear" type="text" inputmode="numeric" maxlength="4" autocomplete="off"></label>
				</div>
				<input id="dateNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<div class="linkInputs" id="dateLinks"></div>
				<label class="checkbox" id="deceasedLabel"><input id="dateDeceased" type="checkbox">Deceased, date unknown</label>
				<div class="issue" id="dateIssue"></div>
				<div class="list" id="dateList"></div>
				<div class="buttons">
					<button type="button" onclick="closeDate()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="relationsDialog">
			<form onsubmit="saveRelations(event)" oninput="updateRelationsDialog(event)" novalidate>
				<div class="title">Relations</div>
				<div class="tabs">
					<button type="button" id="parentsTab" onclick="switchRelationsRole(`parents`)">Parents</button>
					<button type="button" id="siblingsTab" onclick="switchRelationsRole(`siblings`)">Siblings</button>
					<button type="button" id="partnersTab" onclick="switchRelationsRole(`partners`)">Partners</button>
					<button type="button" id="childrenTab" onclick="switchRelationsRole(`children`)">Children</button>
				</div>
				<button type="button" id="openAddRelationButton" onclick="openAddRelationDialog()">+ Add Parent</button>
				<div class="list" id="relationsEntries"></div>
				<div class="list" id="relationsVariants"></div>
				<div class="heading" id="relationsSubtypeHeading"></div>
				<div class="choices" id="relationsSubtypeChoices"></div>
				<input id="relationsNote" type="text" placeholder="Note (optional)" autocomplete="off">
				<div class="linkInputs" id="relationsLinks"></div>
				<div class="coParentEditor" id="relationsCoParentEditor" hidden>
					<div class="heading">Other parent (optional)</div>
					<div class="list" id="relationsCoParentSelected"></div>
					<input id="relationsCoParentSearch" type="text" placeholder="Name of other parent&hellip;" autocomplete="off" onkeydown="handleCoParentSearchKey(event)">
					<div class="list suggestions" id="relationsCoParentSuggestions"></div>
				</div>
				<div class="notice" id="relationsNotice"></div>
				<div class="buttons">
					<button type="button" onclick="closeRelations()">Cancel</button>
					<button type="submit">Save</button>
				</div>
			</form>
		</dialog>
		<dialog id="addRelationDialog">
			<form onsubmit="confirmAddRelation(event)" oninput="updateAddRelationDialog(event)">
				<div class="title" id="addRelationTitle"></div>
				<div class="list" id="addRelationSelected"></div>
				<input id="addRelationSearch" type="text" placeholder="Search a person or type a name..." autocomplete="off" onkeydown="handleAddRelationSearchKey(event)">
				<div class="list suggestions" id="addRelationSuggestions"></div>
				<div class="newPersonFields" id="addRelationNewPersonFields" hidden></div>
				<div class="coParentEditor" id="addCoParentSection" hidden>
					<div class="heading">Other parent (optional)</div>
					<div class="choices" id="addPreviousCoParents"></div>
					<div class="list" id="addCoParentSelected"></div>
					<input id="addCoParentSearch" type="text" placeholder="Name of other parent&hellip;" autocomplete="off" onkeydown="handleAddCoParentSearchKey(event)">
					<div class="list suggestions" id="addCoParentSuggestions"></div>
					<div class="newPersonFields" id="addCoParentNewPersonFields" hidden></div>
				</div>
				<div class="heading">Kind of link</div>
				<div class="choices" id="addRelationSubtypeChoices"></div>
				<div class="buttons">
					<button type="button" onclick="closeAddRelationDialog()">Cancel</button>
					<button type="submit">Add</button>
				</div>
				<div class="issue" id="addRelationIssue"></div>
			</form>
		</dialog>
		<dialog id="shortcutsDialog">
			<form onsubmit="event.preventDefault()">
				<div class="title">Keyboard shortcuts</div>
				<div class="shortcuts">
					<div class="row"><span class="keys"><kbd>S</kbd></span><span class="label">Search</span></div>
					<div class="row"><span class="keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd></span><span class="label">Navigation</span></div>
					<div class="row"><span class="keys"><kbd>E</kbd></span><span class="label">Edit selected field</span></div>
					<div class="row"><span class="keys"><kbd>Enter</kbd></span><span class="label">Open selected item</span></div>
					<div class="row"><span class="keys"><kbd>Ctrl / Cmd</kbd><span class="plus">+</span><kbd>S</kbd></span><span class="label">Export database</span></div>
					<div class="row"><span class="keys"><kbd>/</kbd></span><span class="label">Toggle keybinds</span></div>
				</div>
				<div class="buttons">
					<button type="button" onclick="closeShortcuts()">Close</button>
				</div>
			</form>
		</dialog>
		<dialog id="importDialog">
			<form onsubmit="event.preventDefault()">
				<div class="title">Import</div>
				<div class="summary" id="importSummary"></div>
				<div class="issue" id="importIssue"></div>
				<div class="buttons">
					<button type="button" id="importCancel" onclick="closeImportDialog()">Cancel</button>
					<button type="button" id="importExportFirst" onclick="exportData()" hidden>Export first</button>
					<button type="button" id="importChoose" onclick="chooseImportFile()">Choose JSON file</button>
				</div>
			</form>
		</dialog>
		<dialog id="kinshipDialog">
			<form method="dialog">
				<div class="title" id="kinshipTitle"></div>
				<div class="summary" id="kinshipSummary"></div>
				<div class="chain" id="kinshipChain"></div>
				<div class="buttons">
					<button type="button" onclick="closeKinshipDialog()">Close</button>
				</div>
			</form>
		</dialog>
		<dialog id="auditDialog">
			<form onsubmit="event.preventDefault()">
				<div class="title">Database audit</div>
				<div class="choices" id="auditFilters"></div>
				<div class="auditList" id="auditList"></div>
				<div class="buttons">
					<button type="button" onclick="closeAudit()">Close</button>
				</div>
			</form>
		</dialog>
	</body>
	<script type="text/javascript"src="scripts.js"></script>
	<!-- timeline.js is read before relations.js because relations.js starts the app when it is read, and the first drawing of the remembered person already needs the timeline -->
	<script type="text/javascript"src="timeline.js"></script>
	<script type="text/javascript"src="relations.js"></script>
</html>
